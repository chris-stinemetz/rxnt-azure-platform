name: Dev — App Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Deploy (dev)
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout platform repo
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init (dev)
        working-directory: environments/dev
        run: terraform init
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"

      - name: Read Terraform outputs
        id: tf
        working-directory: environments/dev
        run: |
          echo "acr=$(terraform output -raw acr_login_server)" >> "$GITHUB_OUTPUT"
          echo "aks=$(terraform output -raw aks_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "rg=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"
          echo "kv=$(terraform output -raw key_vault_name)" >> "$GITHUB_OUTPUT"
          echo "csi_client_id=$(terraform output -raw key_vault_secrets_provider_client_id)" >> "$GITHUB_OUTPUT"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"

      - name: Get tenant ID
        id: az
        run: echo "tenant_id=$(az account show --query tenantId -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Checkout application repo
        uses: actions/checkout@v4
        with:
          repository: RXNT/site-mkt
          path: site-mkt

      - name: Build and push images
        run: |
          az acr login --name ${{ steps.tf.outputs.acr }}
          docker build -f site-mkt/Dockerfile.site \
            -t ${{ steps.tf.outputs.acr }}/site:${{ github.sha }} \
            -t ${{ steps.tf.outputs.acr }}/site:latest \
            site-mkt
          docker push ${{ steps.tf.outputs.acr }}/site:${{ github.sha }}
          docker push ${{ steps.tf.outputs.acr }}/site:latest

          docker build -f site-mkt/Dockerfile.api \
            -t ${{ steps.tf.outputs.acr }}/api:${{ github.sha }} \
            -t ${{ steps.tf.outputs.acr }}/api:latest \
            site-mkt
          docker push ${{ steps.tf.outputs.acr }}/api:${{ github.sha }}
          docker push ${{ steps.tf.outputs.acr }}/api:latest

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ steps.tf.outputs.rg }} \
            --name ${{ steps.tf.outputs.aks }} \
            --overwrite-existing

      - name: Helm upgrade
        run: |
          helm upgrade --install marketing-site helm/marketing-site \
            --namespace marketing --create-namespace \
            --set image.apiRepository=${{ steps.tf.outputs.acr }}/api \
            --set image.siteRepository=${{ steps.tf.outputs.acr }}/site \
            --set image.tag=${{ github.sha }} \
            --set keyVault.name=${{ steps.tf.outputs.kv }} \
            --set keyVault.tenantId=${{ steps.az.outputs.tenant_id }} \
            --set keyVault.csiClientId=${{ steps.tf.outputs.csi_client_id }} \
            --wait --timeout 5m
