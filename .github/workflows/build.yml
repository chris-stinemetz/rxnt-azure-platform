name: App — Build Images

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      image_tag:
        description: "Image tag (e.g. latest, git SHA)"
        required: false
        default: "latest"

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Resolve ACR for environment
        id: acr
        run: |
          case "${{ inputs.environment }}" in
            prod) echo "name=rxntmktprdc7e2b4acr" >> $GITHUB_OUTPUT
                  echo "login_server=rxntmktprdc7e2b4acr.azurecr.io" >> $GITHUB_OUTPUT ;;
            *)    echo "name=rxntmktdevb5k9m2acr" >> $GITHUB_OUTPUT
                  echo "login_server=rxntmktdevb5k9m2acr.azurecr.io" >> $GITHUB_OUTPUT ;;
          esac

      - name: Checkout app source
        uses: actions/checkout@v4
        with:
          repository: RXNT/site-mkt

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ steps.acr.outputs.name }}

      - name: Build and push site image
        run: |
          docker build --platform linux/amd64 \
            -f Dockerfile.site \
            -t ${{ steps.acr.outputs.login_server }}/site:${{ inputs.image_tag }} .
          docker push ${{ steps.acr.outputs.login_server }}/site:${{ inputs.image_tag }}

      - name: Build and push api image
        run: |
          docker build --platform linux/amd64 \
            -f Dockerfile.api \
            -t ${{ steps.acr.outputs.login_server }}/api:${{ inputs.image_tag }} .
          docker push ${{ steps.acr.outputs.login_server }}/api:${{ inputs.image_tag }}
