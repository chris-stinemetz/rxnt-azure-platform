image:
  apiRepository: ""      # set via --set during deploy (e.g. myacr.azurecr.io/api)
  siteRepository: ""     # set via --set during deploy (e.g. myacr.azurecr.io/site)
  tag: "latest"
  pullPolicy: Always

keyVault:
  name: ""           # set via --set (terraform output key_vault_name)
  tenantId: ""       # set via --set (az account show --query tenantId)
  csiClientId: ""    # set via --set (terraform output key_vault_secrets_provider_client_id)

api:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

site:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

hpa:
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50
