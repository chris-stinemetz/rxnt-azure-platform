apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: app-secrets
  labels:
    {{- include "marketing-site.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.keyVault.csiClientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: redis-connection-string
          objectType: secret
        - |
          objectName: db-connection-string
          objectType: secret
        - |
          objectName: marketing-api-base-url
          objectType: secret
  secretObjects:
    - secretName: app-secrets
      type: Opaque
      data:
        - objectName: redis-connection-string
          key: REDIS_CONNECTION_STRING
        - objectName: db-connection-string
          key: DB_CONNECTION_STRING
        - objectName: marketing-api-base-url
          key: MarketingApi__BaseUrl
